[project]
name = "intelliagent"
version = "0.1.0"
description = "IntelliAgent - 基于 ReAct 循环的代码开发助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.18.0",
    "httpx>=0.27.0",
    "anyio>=4.11.0",
    "python-dotenv>=1.1.1",
    "pydantic-settings>=2.6.0",
    "aiofiles>=24.1.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "jsonschema>=4.23.0",
    "textual>=0.58.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
intelliagent = "src.headless.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
# 包名 src 在 editable 安装后会被 isort 误判为 third-party（本地/CI 环境检测不一致，
# CI 曾因此对同一文件给出不同判定）；显式声明消除歧义。
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
